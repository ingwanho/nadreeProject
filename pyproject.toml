[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nadree-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "pymysql>=1.1,<2", "pydantic-settings>=2,<3", "PyJWT>=2.10,<3",
  "bcrypt>=4,<6", "cryptography>=44", "redis>=5,<7", "email-validator>=2,<3",
  "ortools>=9.15,<10", "firebase-admin>=6.5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mysql: requires an explicitly configured isolated MySQL test database"]
